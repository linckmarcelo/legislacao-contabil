name: watch-reforma-tributaria

# Roda todo dia as 07:00 BRT (10:00 UTC) e sob demanda via "Run workflow".
#
# Nesta versao (v2) o step que roda o watcher tem continue-on-error: true,
# para que o workflow sempre conclua "success" e o GitHub registre os
# triggers (schedule + workflow_dispatch). Um step de debug no final
# despeja os logs e o summary mesmo que algo tenha quebrado.

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 07:00 BRT
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Quantos dias para tras olhar no DOU (default 7, max 60)'
        required: false
        default: '7'
      dry_run:
        description: 'Se "true", so detecta e relata; nao baixa nem commita'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-reforma
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "watch-reforma-bot"
          git config user.email "watch-reforma-bot@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pdfplumber pandas requests beautifulsoup4 lxml

      - name: Run watcher
        id: watcher
        continue-on-error: true
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -o pipefail
          python scripts/watch/watch_reforma.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --lookback-days "$LOOKBACK_DAYS" \
            --dry-run "$DRY_RUN" \
            --summary-out "$GITHUB_WORKSPACE/_watch_summary.md" 2>&1 | tee _watch_stdout.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          if [ -f "$GITHUB_WORKSPACE/_watch_added.txt" ]; then
            echo "added=$(cat $GITHUB_WORKSPACE/_watch_added.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "added=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug — show logs no matter what
        if: always()
        run: |
          echo "::group::_watch_summary.md"
          cat _watch_summary.md 2>/dev/null || echo "(no summary)"
          echo "::endgroup::"
          echo "::group::_watch_debug.log"
          cat _watch_debug.log 2>/dev/null || echo "(no debug log)"
          echo "::endgroup::"
          echo "::group::_watch_stdout.log"
          cat _watch_stdout.log 2>/dev/null || echo "(no stdout log)"
          echo "::endgroup::"
          echo "watcher.outcome = ${{ steps.watcher.outcome }}"
          echo "watcher.conclusion = ${{ steps.watcher.conclusion }}"

      - name: Commit & push changes
        if: steps.watcher.outputs.added != '0' && steps.watcher.outputs.added != '' && github.event.inputs.dry_run != 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nada pra commitar (apesar do watcher ter detectado)."
            exit 0
          fi
          added="${{ steps.watcher.outputs.added }}"
          today="$(date -u +%Y-%m-%d)"
          git commit -m "feat(watch): indexa ${added} norma(s) nova(s) da reforma tributaria em ${today}

Deteccao automatica via DOU (in.gov.br).
Ver _watch_summary.md para detalhes das normas indexadas.

Co-Authored-By: watch-reforma-bot <watch-reforma-bot@users.noreply.github.com>"
          git push

      - name: Open summary issue
        if: steps.watcher.outputs.added != '0' && steps.watcher.outputs.added != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDED: ${{ steps.watcher.outputs.added }}
        run: |
          today="$(date -u +%Y-%m-%d)"
          title="Reforma tributaria — ${today}: ${ADDED} norma(s) indexada(s)"
          body="$(cat _watch_summary.md)"
          gh issue create --title "$title" --body "$body" || true

      - name: Upload summary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-summary-${{ github.run_id }}
          path: |
            _watch_summary.md
            _watch_debug.log
            _watch_stdout.log
          if-no-files-found: warn
          retention-days: 30
